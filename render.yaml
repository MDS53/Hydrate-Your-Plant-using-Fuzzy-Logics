services:
  # Python Flask Backend Web Service
  - type: web
    name: plantcare-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app"
    envVars:
      - key: PORT
        value: 5055
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHER_API_BASE
        value: https://api.open-meteo.com/v1/forecast

  # React Frontend Static Site
  - type: web
    name: plantcare-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: "npm --prefix client ci && npm --prefix client run build"
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
